# Render blueprint for the Continuum API + PostgreSQL database.
#
# Optional secrets (GEMINI_API_KEY, GITHUB_TOKEN, SUPABASE_URL, etc.) can be
# added in the Render Dashboard -> Environment tab after deployment without
# blocking initial provisioning. Do NOT put real credentials in this file.
databases:
  - name: continuum-db
    plan: free
    databaseName: continuum
    user: continuum

services:
  - type: web
    name: continuum-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations run before starting uvicorn so the database schema is always
    # current on every deploy.
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The API refuses to start if ALLOW_DEV_AUTH is true in production.
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO_READ_ONLY
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: continuum-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://continui.vercel.app,http://localhost:5173
