# Render blueprint for the Continuum API.
#
# Values marked `sync: false` are set in the Render dashboard and are never
# committed. Do NOT put real credentials in this file.
services:
  - type: web
    name: continuum-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations run as part of the release command so the schema is always
    # current; the start command then binds to the port Render provides.
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # The API refuses to start if ALLOW_DEV_AUTH is true in production.
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_DEV_AUTH
        value: "false"
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: PUBLIC_DEMO_READ_ONLY
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set in the dashboard: services.env.example documents every variable.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
