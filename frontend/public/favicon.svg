<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Continuum "C" monogram on charcoal background -->
  <rect width="32" height="32" rx="7" fill="#1E1E1C"/>
  <!-- Arc suggesting continuity / infinite loop, electric blue -->
  <path
    d="M22 10.5A8.5 8.5 0 1 0 22 21.5"
    stroke="#2F6BFF"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <!-- Small dot at arc end — the "." from the wordmark -->
  <circle cx="22" cy="21.5" r="1.8" fill="#D8CBB3"/>
</svg>
