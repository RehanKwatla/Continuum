<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <meta
      name="description"
      content="Continuum — Agentic Project Continuity Platform. Reconstruct project knowledge from commits, pull requests and documents so your handover survives the people who leave."
    />
    <meta name="theme-color" content="#100E14" />

    <!-- Theme hydration script to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('continuum.theme');
          var isDark = stored ? stored === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Continuum — Project Continuity Platform" />
    <meta
      property="og:description"
      content="Reconstruct project knowledge from commits, pull requests and documents. People leave. Knowledge stays."
    />
    <meta property="og:site_name" content="Continuum" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Continuum — Project Continuity Platform" />
    <meta
      name="twitter:description"
      content="Reconstruct project knowledge from commits, pull requests and documents."
    />

    <title>Continuum — Project Continuity Platform</title>

    <!-- Fonts: Plus Jakarta Sans, Inter, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
