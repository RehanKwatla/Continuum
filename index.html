    <span>${icon('calendar', 'icon--sm')}${esc(claim.date || 'Unknown')}</span>
    <span class="confidence">${icon('activity', 'icon--sm')}${Math.round(claim.confidence * 100)}%<span class="confidence__bar"><span class="confidence__fill" style="width:${Math.round(claim.confidence * 100)}%"></span></span></span>
    ${claim.source ? `<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px">${icon('fileText', 'icon--sm')}${esc(claim.source)}</span>` : ''}
  </div>`;
}

function renderClaimCard(project, claim, actions = '') {
  return `<article class="claim">
    <span class="claim__icon">${icon(CLAIM_TYPE_ICON[claim.type] || 'fileText')}</span>
    <div class="claim__main">
      <div class="claim__top">${typeBadge(claim.type)}${statusBadge(claim.status)}${claim.critical ? badge('Critical', 'red', 'alertTriangle') : ''}<span class="mono text-tiny text-muted">${esc(claim.id.toUpperCase())}</span></div>
      <p class="claim__text">${esc(claim.text)}</p>
      ${claimMeta(claim)}
    </div>
    <div class="claim__actions">${actions || `<button class="btn btn--secondary btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">View${icon('chevronRight', 'icon--sm')}</button>`}</div>
  </article>`;
}

function renderProjectMemory(project) {
  const counts = {
    approved: approvedClaims(project).length,
    pending: reviewItems(project).length,
    conflicts: project.claims.filter((claim) => claim.status === 'Conflict').length,
    clarification: project.claims.filter((claim) => claim.status === 'Needs clarification').length
  };
  const typeCounts = Object.entries(project.claims.reduce((acc, claim) => { acc[claim.type] = (acc[claim.type] || 0) + 1; return acc; }, {})).sort((a, b) => b[1] - a[1]);
  const recent = project.claims.slice(0, 4);
  const total = project.claims.length;

  return `${sectionHead('Project memory', 'Every approved fact, decision and constraint reconstructed from this project’s authorised sources.', `<a class="btn btn--secondary btn--sm" href="#/projects/${project.id}/memory/review">${icon('list')}Review queue</a><button class="btn btn--primary btn--sm" type="button" data-action="run-extraction" data-project="${project.id}">${icon('sparkles')}Run extraction</button>`)}

  <div class="grid grid--4">
    ${metricTile('Reconstructed claims', project.claimCount, 'Decisions, constraints & dependencies', 'brain', 'blue')}
    ${metricTile('Approved', counts.approved, 'Human-verified claims', 'shieldCheck', 'green')}
    ${metricTile('Pending review', counts.pending, 'Awaiting a human decision', 'clock')}
    ${metricTile('Open conflicts', openConflictCount(project), 'Contradictory claims kept side by side', 'scale', openConflictCount(project) ? 'amber' : 'green')}
  </div>

  <div class="grid grid--2-1" style="margin-top:16px;align-items:start">
    <div class="card">
      <div class="card__head"><div class="card__title">${icon('sparkles')}Recent claims</div><a class="btn btn--ghost btn--sm" href="#/projects/${project.id}/memory/claims">View all${icon('arrowRight', 'icon--sm')}</a></div>
      <div class="card__body" style="display:flex;flex-direction:column;gap:10px">
        ${recent.map((claim) => `<article class="claim" style="padding:13px 14px">
          <span class="claim__icon">${icon(CLAIM_TYPE_ICON[claim.type] || 'fileText')}</span>
          <div class="claim__main">
            <div class="claim__top">${typeBadge(claim.type)}${statusBadge(claim.status)}<span class="mono text-tiny text-muted">${esc(claim.id.toUpperCase())}</span></div>
            <p class="claim__text">${esc(claim.text)}</p>
            <div class="claim__meta"><span>${icon('fileText', 'icon--sm')}${esc(claim.source)}</span><span>${icon('calendar', 'icon--sm')}${esc(claim.date)}</span></div>
          </div>
          <div class="claim__actions"><button class="btn btn--ghost btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">${icon('chevronRight')}</button></div>
        </article>`).join('')}
      </div>
    </div>
    <div class="aside-stack">
      <div class="card aside-card">
        <div class="aside-title">Claim status</div>
        <div class="status-bars">
          ${[
            { label: 'Approved', count: counts.approved, tone: 'green', color: 'var(--success)' },
            { label: 'Pending review', count: counts.pending, tone: 'blue', color: 'var(--primary)' },
            { label: 'Conflict', count: counts.conflicts, tone: 'red', color: 'var(--error)' },
            { label: 'Needs clarification', count: counts.clarification, tone: 'amber', color: 'var(--warning)' }
          ].map((row) => `<div><div class="status-bar__top"><span class="status-bar__label">${badge(row.label, row.tone)}</span><span class="status-bar__count">${row.count} / ${total}</span></div><div class="status-bar__track"><div class="status-bar__fill" style="width:${Math.round((row.count / total) * 100)}%;background:${row.color}"></div></div></div>`).join('')}
        </div>
      </div>
      <div class="card aside-card">
        <div class="aside-title">Claims by type</div>
        <ul class="category-list">
          ${typeCounts.slice(0, 7).map(([type, count]) => `<li><span class="category-list__label">${icon(CLAIM_TYPE_ICON[type] || 'fileText', 'icon--sm')}${esc(type)}</span><span class="category-list__value">${count}</span></li>`).join('')}
        </ul>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="run-panel card__body">
      <div class="run-panel__left"><span class="run-panel__icon">${icon('sparkles')}</span><div><div class="run-panel__title">Extraction pipeline</div><div class="run-panel__sub">Last run 3 days ago · ${project.sources.length} sources processed · deterministic, evidence-linked</div></div></div>
      <button class="btn btn--secondary btn--sm" type="button" data-action="run-extraction" data-project="${project.id}">${icon('refresh')}Run again</button>
    </div>
  </div>`;
}

/* ============================================================
   Project · Claims
   ============================================================ */
function renderClaims(project) {
  const query = UI.claimsSearch.trim().toLowerCase();
  const types = [...new Set(project.claims.map((claim) => claim.type))];
  const filtered = project.claims.filter((claim) => {
    const matchesQuery = !query || `${claim.id} ${claim.text} ${claim.source}`.toLowerCase().includes(query);
    const matchesType = UI.claimsType === 'all' || claim.type === UI.claimsType;
    const matchesStatus = UI.claimsStatus === 'all' || claim.status === UI.claimsStatus;
    return matchesQuery && matchesType && matchesStatus;
  });
  const pageSize = 8;
  const pages = Math.max(1, Math.ceil(filtered.length / pageSize));
  const page = Math.min(UI.claimsPage, pages);
  const visible = filtered.slice((page - 1) * pageSize, (page - 1) * pageSize + pageSize);

  return `${sectionHead('Claims', 'Every statement Continuum has reconstructed, its status and the evidence behind it.', `<span class="badge badge--outline">${project.claims.length} total</span><a class="btn btn--secondary btn--sm" href="#/projects/${project.id}/memory/review">${icon('list')}Review queue</a>`)}

  <div class="card">
    <div class="toolbar">
      <label class="field field--search"><span class="sr-only">Search claims</span><span class="field__icon">${icon('search', 'icon--sm')}</span><input class="input" type="search" placeholder="Search claims" value="${esc(UI.claimsSearch)}" data-search="claims" autocomplete="off"></label>
      <label class="field" style="flex:0 1 190px"><span class="sr-only">Filter by type</span><select class="select" data-filter="claims-type"><option value="all" ${UI.claimsType === 'all' ? 'selected' : ''}>All types</option>${types.map((type) => `<option value="${esc(type)}" ${UI.claimsType === type ? 'selected' : ''}>${esc(type)}</option>`).join('')}</select></label>
      <label class="field" style="flex:0 1 175px"><span class="sr-only">Filter by status</span><select class="select" data-filter="claims-status"><option value="all" ${UI.claimsStatus === 'all' ? 'selected' : ''}>Any status</option>${['Approved','Pending review','Conflict','Needs clarification','Extracted','Rejected'].map((status) => `<option value="${status}" ${UI.claimsStatus === status ? 'selected' : ''}>${status}</option>`).join('')}</select></label>
    </div>
    ${visible.length ? `<div class="table-wrap">
      <table class="table">
        <thead><tr><th>Claim</th><th>Type</th><th>Status</th><th class="table__right">Confidence</th><th>Source</th><th></th></tr></thead>
        <tbody>
          ${visible.map((claim) => `<tr>
            <td style="max-width:340px"><button type="button" class="table__source" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}" style="text-align:left;width:100%"><span class="table__title">${esc(claim.text)}</span><span class="table__sub"><span class="mono">${esc(claim.id.toUpperCase())}</span> · ${claim.critical ? 'Critical claim' : 'Supporting claim'}</span></button></td>
            <td>${typeBadge(claim.type)}</td>
            <td>${statusBadge(claim.status)}</td>
            <td class="table__num">${Math.round(claim.confidence * 100)}%</td>
            <td class="text-tiny text-muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(claim.source)}</td>
            <td class="table__right"><button class="btn btn--ghost btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">View${icon('chevronRight', 'icon--sm')}</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span>Showing ${filtered.length ? (page - 1) * pageSize + 1 : 0}–${Math.min(page * pageSize, filtered.length)} of ${filtered.length} · page ${page} of ${pages}</span>
      <div class="pagination__buttons">
        <button class="btn btn--secondary btn--sm" type="button" data-action="claims-page" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>${icon('chevronLeft', 'icon--sm')}Previous</button>
        ${Array.from({ length: pages }).map((_, index) => `<button class="page-num ${page === index + 1 ? 'is-active' : ''}" type="button" data-action="claims-page" data-page="${index + 1}">${index + 1}</button>`).join('')}
        <button class="btn btn--secondary btn--sm" type="button" data-action="claims-page" data-page="${page + 1}" ${page >= pages ? 'disabled' : ''}>Next${icon('chevronRight', 'icon--sm')}</button>
      </div>
    </div>` : emptyState('search', 'No matching claims', 'Adjust the search or filters to see other claims.', '<button class="btn btn--secondary btn--sm" type="button" data-action="clear-claim-filters">Clear filters</button>')}
  </div>`;
}

/* ============================================================
   Project · Review queue
   ============================================================ */
function renderReviewQueue(project) {
  const pending = reviewItems(project);
  const approved = approvedClaims(project);
  const rejected = project.claims.filter((claim) => claim.status === 'Rejected');
  const filter = UI.reviewFilter;
  const list = filter === 'pending' ? pending : filter === 'approved' ? approved : filter === 'rejected' ? rejected : [...pending, ...approved];
  const visible = filter === 'all' ? list.slice(0, 12) : list;

  return `${pageHeader({
    eyebrow: 'Human in the loop',
    title: 'Review queue',
    desc: 'Approve or reject reconstructed claims. AI verdicts are advisory — only a human reviewer can establish project truth.',
    actions: `<a class="btn btn--secondary btn--sm" href="#/projects/${project.id}/memory">${icon('brain')}All memory</a>`
  })}

  <div class="grid grid--4" style="margin-top:22px">
    ${metricTile('Awaiting review', pending.length, 'Claims waiting for a human decision', 'clock', 'blue')}
    ${metricTile('Approved', approved.length, 'Verified and evidence-linked', 'shieldCheck', 'green')}
    ${metricTile('Rejected', rejected.length, 'Kept for the audit trail', 'x')}
    ${metricTile('Open conflicts', openConflictCount(project), 'May need a separate decision', 'alertTriangle', openConflictCount(project) ? 'amber' : 'green')}
  </div>

  <div class="row-between" style="margin-top:20px;gap:12px;flex-wrap:wrap">
    <div class="segmented" role="tablist" aria-label="Review filters">
      ${[['pending','Awaiting review'],['approved','Approved'],['rejected','Rejected'],['all','All decisions']].map(([key, label]) => `<button type="button" class="${filter === key ? 'is-active' : ''}" data-action="review-filter" data-filter="${key}">${label}</button>`).join('')}
    </div>
    <div class="legend"><span>${icon('shieldCheck', 'icon--sm success-text')}Human approval required</span><span>${icon('sparkles', 'icon--sm')}AI verdict is advisory</span></div>
  </div>

  <div class="stack-3" style="margin-top:14px">
    ${visible.length ? visible.map((claim) => renderClaimCard(project, claim, claim.status === 'Pending review' || claim.status === 'Extracted' ? `<button class="btn btn--primary btn--xs" type="button" data-action="approve-claim" data-project="${project.id}" data-claim="${claim.id}">${icon('check', 'icon--sm')}Approve</button><button class="btn btn--danger btn--xs" type="button" data-action="reject-claim" data-project="${project.id}" data-claim="${claim.id}">${icon('x', 'icon--sm')}Reject</button><button class="btn btn--ghost btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">Evidence</button>` : `<button class="btn btn--ghost btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">Details${icon('chevronRight', 'icon--sm')}</button>`)).join('') : `<div class="card">${emptyState('checkCircle', filter === 'pending' ? 'Review queue is clear' : 'Nothing here yet', filter === 'pending' ? 'Every extracted claim has a human decision. Run extraction again to surface new claims.' : 'Switch filters to inspect other review decisions.', `<a class="btn btn--secondary btn--sm" href="#/projects/${project.id}/memory">Back to memory</a>`)}</div>`}
  </div>

  <div class="note-strip" style="margin-top:18px">${icon('info', 'icon--sm')}<span><strong>Preview behaviour.</strong> Decisions update this browser session only. In the full product, approvals are recorded in the append-only audit trail with reviewer identity and evidence.</span></div>`;
}

/* ============================================================
   Project · Conflicts
   ============================================================ */
function renderConflicts(project) {
  const selectedId = UI.selectedConflict && project.conflicts.some((conflict) => conflict.id === UI.selectedConflict) ? UI.selectedConflict : project.conflicts[0]?.id;
  const conflict = project.conflicts.find((item) => item.id === selectedId) || project.conflicts[0];

  if (!conflict) {
    return `<div class="card">${emptyState('checkCircle', 'No conflicts detected', 'Continuum found no contradictory statements across this project’s sources.')}</div>`;
  }

  const claimA = conflict.claims[0];
  const claimB = conflict.claims[1];

  return `${sectionHead('Conflict centre', 'Contradictory claims are kept side by side. Nothing is deleted and no side is picked automatically.', `<span class="badge ${openConflictCount(project) ? 'badge--red' : 'badge--green'}">${openConflictCount(project)} open</span>`)}

  <div class="conflict-layout">
    <div class="conflict-list">
      ${project.conflicts.map((item) => `<button class="conflict-row ${item.id === conflict.id ? 'is-active' : ''}" type="button" data-action="select-conflict" data-project="${project.id}" data-conflict="${item.id}">
        <span class="conflict-row__top">${statusBadge(item.status)}<span class="text-tiny text-muted">${esc(item.kind)}</span></span>
        <span class="conflict-row__summary">${esc(item.summary)}</span>
        <span class="conflict-row__meta"><span>${esc(item.entity)}.${esc(item.property)}</span><span>${esc(item.created)}</span></span>
      </button>`).join('')}
      <div class="note-strip" style="margin-top:4px">${icon('info', 'icon--sm')}<span>Conflicts are findings, not failures. Resolving one records a decision for the successor.</span></div>
    </div>

    <div class="card conflict-detail card__body">
      <div class="conflict-hero">
        <div class="conflict-hero__title">${icon('alertTriangle')}${esc(conflict.kind)} ${statusBadge(conflict.status)}</div>
        <p style="font-size:12px;line-height:1.65;color:var(--muted)">${esc(conflict.summary)}</p>
        <div class="row" style="margin-top:4px">${badge(`${conflict.entity}.${conflict.property}`, 'outline', 'database')}<span class="text-tiny text-muted">Detected ${esc(conflict.created)}</span></div>
      </div>
      <div class="claim-compare">
        ${[claimA, claimB].map((claim) => `<div class="compare-card">
          <div class="compare-card__top"><span class="badge badge--gray badge--mono">${esc(claim.label)}</span>${statusBadge(claim.status)}<span class="text-tiny text-muted" style="margin-left:auto">${Math.round(claim.confidence * 100)}%</span></div>
          <p class="compare-card__text">${esc(claim.text)}</p>
          <div class="compare-card__meta">${icon('user', 'icon--sm')} ${esc(claim.author)} · ${esc(claim.date)}</div>
          <div class="evidence"><div class="evidence__label">Evidence</div><blockquote>${esc(claim.evidence)}</blockquote><span class="evidence__source">${esc(claim.source)}</span></div>
        </div>`).join('')}
      </div>
      <p class="text-tiny text-muted" style="line-height:1.65">${esc(conflict.detail)}</p>
      ${conflict.status === 'Open' ? `<div class="decision-panel">
        <div class="card__title" style="margin-bottom:9px">${icon('scale')}Record a decision</div>
        <label class="radio-card"><input type="radio" name="conflict-decision" value="0"><span><span class="radio-card__label">Claim A stands</span><span class="radio-card__hint">${esc(claimA.text)}</span></span></label>
        <label class="radio-card"><input type="radio" name="conflict-decision" value="1"><span><span class="radio-card__label">Claim B stands</span><span class="radio-card__hint">${esc(claimB.text)}</span></span></label>
        <label class="radio-card"><input type="radio" name="conflict-decision" value="both"><span><span class="radio-card__label">Both are valid in different contexts</span><span class="radio-card__hint">Record a clarification rather than rejecting either side.</span></span></label>
        <div class="row" style="margin-top:10px"><button class="btn btn--primary btn--sm" type="button" data-action="resolve-conflict" data-project="${project.id}" data-conflict="${conflict.id}">${icon('check')}Resolve conflict</button><button class="btn btn--ghost btn--sm" type="button" data-action="simulate-demo">${icon('help')}Ask for context</button></div>
        <p class="review-note" style="margin-top:9px">The decision is recorded with reviewer identity in the audit trail. Claims are never deleted.</p>
      </div>` : `<div class="note-strip" style="border-color:rgba(52,211,153,.22);background:var(--success-soft);color:#34D399">${icon('checkCircle', 'icon--sm')}<span><strong>Resolved ${esc(conflict.resolved || '')}.</strong> ${esc(conflict.resolution || 'A human reviewer recorded the decision.')} Both original claims remain in the memory for traceability.</span></div>`}
    </div>
  </div>`;
}

/* ============================================================
   Project · Uncertainty
   ============================================================ */
function renderUncertainty(project) {
  const uncertain = project.claims.filter((claim) => claim.status === 'Needs clarification' || claim.status === 'Extracted');
  const openQuestions = project.claims.filter((claim) => claim.type === 'Open question');
  return `${sectionHead('Uncertainty centre', 'Statements that cannot yet be treated as project truth. They remain visible instead of being silently discarded.', `<span class="badge badge--amber">${uncertain.length} unresolved</span>`)}

  <div class="grid grid--2-1" style="align-items:start">
    <div class="stack-3">
      ${uncertain.length ? uncertain.map((claim) => renderClaimCard(project, claim, `<button class="btn btn--secondary btn--xs" type="button" data-action="open-claim" data-project="${project.id}" data-claim="${claim.id}">Review${icon('chevronRight', 'icon--sm')}</button>`)).join('') : `<div class="card">${emptyState('checkCircle', 'No uncertain claims', 'Every claim currently has a clear human decision.')}</div>`}
    </div>
    <div class="aside-stack">
      <div class="card aside-card">
        <div class="aside-title">Why claims stay uncertain</div>
        <div class="stack-3">
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start">${icon('help', 'icon--sm')}<span class="text-tiny text-muted">The source raises a question instead of stating a fact.</span></div>
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start">${icon('fileText', 'icon--sm')}<span class="text-tiny text-muted">Evidence exists but is too weak for automatic approval.</span></div>
          <div class="row" style="flex-wrap:nowrap;align-items:flex-start">${icon('scale', 'icon--sm')}<span class="text-tiny text-muted">Two claims disagree and need a human decision.</span></div>
        </div>
      </div>
      <div class="card aside-card">
        <div class="aside-title">Open questions</div>
        <div class="stack-3">
          ${openQuestions.length ? openQuestions.map((claim) => `<div style="font-size:12.5px;line-height:1.55;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--border-soft)">${esc(claim.text)}<div class="mono" style="font-size:12.5px;margin-top:3px;color:rgba(142,115,139,.25)">${esc(claim.id.toUpperCase())} · ${esc(claim.source)}</div></div>`).join('') : `<p class="text-tiny text-muted">No open questions recorded.</p>`}
        </div>
      </div>
      <div class="note-strip">${icon('info', 'icon--sm')}<span>Uncertainty is a first-class part of project memory, not an error state.</span></div>
    </div>
  </div>`;
}

/* ============================================================
   Project · Timeline
   ============================================================ */
function renderTimeline(project) {
  const filters = [
    { key: 'all', label: 'All events' },
    { key: 'Decision', label: 'Decisions' },
    { key: 'Procedure', label: 'Procedures' },
    { key: 'Architecture', label: 'Architecture' },
    { key: 'Conflict', label: 'Conflicts' },
    { key: 'Open question', label: 'Questions' },
    { key: 'Handover', label: 'Handover' }
  ];
  const items = UI.timelineFilter === 'all' ? project.timeline : project.timeline.filter((item) => item.label === UI.timelineFilter);
  return `${sectionHead('Decision timeline', 'The evidential history of this project: decisions, procedures, status changes and open questions in order.', `<span class="badge badge--outline">${project.timeline.length} events</span>`)}

  <div class="row" style="margin-bottom:18px;gap:4px;flex-wrap:wrap">
    ${filters.map((filter) => `<button class="filter-chip ${UI.timelineFilter === filter.key ? 'is-active' : ''}" type="button" data-action="timeline-filter" data-filter="${esc(filter.key)}">${esc(filter.label)}</button>`).join('')}
  </div>

  <div class="guide-layout">
    <div class="card card__body">
      ${items.length ? `<div class="timeline">
        ${items.map((item) => `<div class="timeline-item timeline-item--${item.tone}">
          <div class="timeline-item__date">${esc(item.date)}</div>
          <div class="timeline-item__title">${esc(item.title)}</div>
          <p class="timeline-item__desc">${esc(item.detail)}</p>
          <div class="timeline-item__meta">${badge(item.label, item.tone === 'green' ? 'green' : item.tone === 'amber' ? 'amber' : 'blue')}${icon('fileText', 'icon--sm')}<span class="mono">${esc(item.source)}</span></div>
        </div>`).join('')}
      </div>` : emptyState('filter', 'No events match this filter', 'Choose another event type to continue exploring the timeline.')}
    </div>
    <div class="aside-stack">
      <div class="card aside-card">
        <div class="aside-title">Event mix</div>
        <ul class="category-list">
          ${[...new Set(project.timeline.map((item) => item.label))].map((label) => `<li><span class="category-list__label">${esc(label)}</span><span class="category-list__value">${project.timeline.filter((item) => item.label === label).length}</span></li>`).join('')}
        </ul>
      </div>
      <div class="card aside-card">
        <div class="aside-title">About this timeline</div>
        <p class="text-tiny text-muted" style="line-height:1.6">Timeline events link back to an evidence source. Nothing can be edited without recording a new auditable decision.</p>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   Project · Handover
   ============================================================ */
function handoverMarkdown(project) {
  const sections = handoverSections(project);
  const lines = [
    `# ${project.name} — Handover`,
    '',
    `**Version:** ${project.handoverVersion} · **Status:** ${project.handoverStatus} · **Readiness:** ${project.readiness}%`,
    `**Workspace:** ${project.workspace}`,
    `**Departing role:** ${project.departingRole} · **Successor role:** ${project.successorRole}`,
    '',
    '> Synthetic demonstration content generated by the Continuum UI preview. Not real project documentation.',
    ''
  ];
  sections.forEach((section, index) => {
    lines.push(`## ${index + 1}. ${section.title}`, '');
    section.statements.forEach((statement) => {
      lines.push(`- ${statement.text}${statement.claim ? ` (${statement.claim})` : ''}${statement.question ? ' — unresolved question' : ''}`);
    });
    lines.push('');
  });
  return lines.join('\n');
}

function renderHandover(project) {
  const sections = handoverSections(project);
  const statements = sections.reduce((sum, section) => sum + section.statements.length, 0);
  return `${sectionHead('Handover', 'A synthesised brief containing the consensus, decisions, procedures and boundaries the successor needs.', `<span class="badge badge--green">${icon('checkCircle')}${esc(project.handoverVersion)} published</span><span class="badge badge--outline badge--mono">Score ${project.readiness}</span>`)}

  <div class="handover-layout">
    <div class="handover-aside">
      <div class="card version-card">
        <div class="version-card__label">Version history</div>
        <div class="version-row"><span class="row" style="gap:5px;font-weight:600">${esc(project.handoverVersion)} ${badge('Published', 'green')}</span><span class="version-row__meta">3 days ago</span></div>
        <div class="version-row"><span class="row" style="gap:5px;color:var(--muted)">Draft 2</span><span class="version-row__meta">4 days ago</span></div>
        <div class="version-row"><span class="row" style="gap:5px;color:var(--muted)">Draft 1</span><span class="version-row__meta">6 days ago</span></div>
        <div class="divider divider--tight"></div>
        <div class="text-tiny text-muted" style="line-height:1.55">Approved by <strong style="color:var(--text)">Public Demo</strong> (Owner) and published to the synthetic demo workspace.</div>
      </div>
      <div class="card version-card">
        <div class="version-card__label">Document</div>
        <div class="def-list">
          ${defRow('Sections', String(sections.length))}
          ${defRow('Statements', String(statements))}
          ${defRow('Sources', String(project.sourcesCount))}
          ${defRow('Tasks', String(project.tasks.length))}
        </div>
      </div>
      <div class="stack-2 no-print">
        <button class="btn btn--secondary btn--sm btn--block" type="button" data-action="download-handover" data-project="${project.id}">${icon('download')}Download Markdown</button>
        <button class="btn btn--secondary btn--sm btn--block" type="button" data-action="print-handover">${icon('fileText')}Print handover</button>
        <a class="btn btn--primary btn--sm btn--block" href="#/projects/${project.id}/readiness">${icon('target')}Readiness report</a>
      </div>
      <div class="handover-summary">Every statement links back to approved evidence. Unresolved questions are kept explicit so the successor can see what is still unknown.</div>
    </div>

    <div class="card handover-doc">
      <div class="handover-doc__head">
        <div class="row-between" style="align-items:flex-start;gap:14px">
          <div>
            <div class="handover-doc__title">${esc(project.name)} — Handover</div>
            <div class="handover-doc__meta">${badge('Published', 'green', 'checkCircle')}${badge(`${esc(project.handoverVersion)}`, 'outline', 'book')}<span>Generated 3 days ago</span><span>·</span><span>${esc(project.workspace)}</span></div>
          </div>
          <span class="badge badge--green" style="gap:6px">${icon('checkCircle')}Approved</span>
        </div>
      </div>
      <div class="handover-doc__body">
        ${sections.map((section, index) => `<section class="doc-section">
          <div class="doc-section__head"><span class="doc-section__num">${String(index + 1).padStart(2, '0')}</span><h3 class="doc-section__title">${esc(section.title)}</h3></div>
          ${section.statements.map((statement) => `<div class="doc-statement"><span class="doc-statement__bullet"></span><span>${esc(statement.text)}${statement.question ? ' <span class="badge badge--amber" style="margin-left:4px">Open question</span>' : ''}</span>${statement.claim ? `<span class="doc-statement__claim">${esc(statement.claim)}</span>` : ''}</div>`).join('')}
        </section>`).join('')}
        <div class="note-strip" style="margin-top:18px">${icon('shieldCheck', 'icon--sm')}<span>This handover is synthetic demonstration content. In the full product, every statement would carry a live evidence link and reviewer approval.</span></div>
      </div>
    </div>
  </div>`;
}

/* ============================================================
   Project · Readiness
   ============================================================ */
function renderReadiness(project) {
  const circumference = 2 * Math.PI * 58;
  const offset = circumference * (1 - project.readiness / 100);
  const ringColor = project.readiness >= 90 ? 'var(--success)' : 'var(--warning)';
  const groups = [...new Set(project.requirements.map((req) => req.group))];
  const scorecard = project.scorecard;

  return `${sectionHead('Handover readiness', 'A deterministic assessment of whether this project is ready for its next owner. Same inputs always produce the same score.', `<span class="badge badge--outline">Last evaluated ${state.readinessUpdated ? 'just now' : '3 days ago'}</span><button class="btn btn--secondary btn--sm" type="button" data-action="run-evaluation" data-project="${project.id}">${icon('rotate')}Re-evaluate</button>`)}

  <div class="card">
    <div class="score-hero">
      <div class="score-ring" role="img" aria-label="Readiness ${project.readiness} percent">
        <svg viewBox="0 0 136 136" aria-hidden="true">
          <circle class="score-ring__track" cx="68" cy="68" r="58"></circle>
          <circle class="score-ring__value" cx="68" cy="68" r="58" stroke="${ringColor}" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="score-ring__center"><span class="score-ring__num">${project.readiness}<span>%</span></span><span class="score-ring__label" style="${ringColor === 'var(--warning)' ? 'color:#C995BC' : ''}">${esc(project.readinessBand)}</span></div>
      </div>
      <div class="score-hero__main">
        <div class="score-hero__title">${esc(project.readinessBand)} ${badge(project.readinessBand, project.readiness >= 90 ? 'green' : 'amber', project.readiness >= 90 ? 'checkCircle' : 'alertTriangle')}</div>
        <p class="score-hero__desc">Weighted across knowledge coverage, evidence quality, ownership, handover completeness and open risks. The score is reproducible from the claims and requirements below.</p>
        <div class="score-stats">
          <div class="score-stat"><div class="score-stat__label">Blockers</div><div class="score-stat__value ${project.blockers.length ? 'score-stat__value--amber' : 'score-stat__value--green'}">${project.blockers.length}</div></div>
          <div class="score-stat"><div class="score-stat__label">Warnings</div><div class="score-stat__value ${project.warnings.length ? 'score-stat__value--amber' : 'score-stat__value--green'}">${project.warnings.length}</div></div>
          <div class="score-stat"><div class="score-stat__label">Requirements</div><div class="score-stat__value">${project.requirements.filter((req) => req.status === 'Complete').length} / ${project.requirements.length}</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid--2-1" style="margin-top:16px;align-items:start">
    <div class="card">
      <div class="card__head"><div class="card__title">${icon('layers')}Readiness dimensions</div><span class="badge badge--outline">Weighted</span></div>
      <div class="card__body">
        ${project.dimensions.map((dimension) => `<div class="dimension">
          <div class="dimension__top"><span class="dimension__name">${esc(dimension.label)}<span class="dimension__meta">${dimension.complete}/${dimension.total} · ${dimension.weight}% weight</span></span><span class="dimension__score">${dimension.score}%</span></div>
          <div class="dimension__track"><div class="dimension__fill ${dimension.score >= 90 ? 'dimension__fill--green' : 'dimension__fill--amber'}" style="width:${dimension.score}%"></div></div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card__head"><div class="card__title">${icon('activity')}Readiness signals</div></div>
      <div class="card__body">
        <div class="grid grid--2" style="gap:9px">
          ${scorecard.map((item) => `<div class="metric-mini"><div class="metric-mini__label">${esc(item.label)}</div><div class="metric-mini__value">${esc(item.value)}</div><div class="metric-mini__hint">${esc(item.hint)}</div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>

  ${project.blockers.length || project.warnings.length ? `<div class="grid grid--2" style="margin-top:16px;align-items:start">
    <div class="card">
      <div class="card__head"><div class="card__title">${icon('alertTriangle')}Blockers</div>${badge(`${project.blockers.length} open`, project.blockers.length ? 'red' : 'green')}</div>
      <div class="card__body">
        ${project.blockers.length ? `<div class="issue-list">${project.blockers.map((blocker) => `<div class="issue issue--danger">${icon('alertCircle', 'icon--sm')}<div><span class="issue__label">Blocker</span><strong style="color:#F87171">${esc(blocker.title)}</strong><div style="margin-top:2px">${esc(blocker.text)}</div></div></div>`).join('')}</div>` : `<div class="note-strip" style="border-color:rgba(52,211,153,.22);background:var(--success-soft);color:#34D399">${icon('checkCircle', 'icon--sm')}<span>No blockers remain. This project can be fully approved.</span></div>`}
      </div>
    </div>
    <div class="card">
      <div class="card__head"><div class="card__title">${icon('info')}Warnings</div>${badge(`${project.warnings.length} open`, project.warnings.length ? 'amber' : 'green')}</div>
      <div class="card__body">
        ${project.warnings.length ? `<div class="issue-list">${project.warnings.map((warning) => `<div class="issue issue--warn">${icon('alertTriangle', 'icon--sm')}<div><span class="issue__label">Warning</span><strong style="color:#FBBF24">${esc(warning.title)}</strong><div style="margin-top:2px">${esc(warning.text)}</div></div></div>`).join('')}</div>` : `<div class="note-strip" style="border-color:rgba(52,211,153,.22);background:var(--success-soft);color:#34D399">${icon('checkCircle', 'icon--sm')}<span>No warnings recorded.</span></div>`}
      </div>
    </div>
  </div>` : ''}

  <div class="card" style="margin-top:16px">
    <div class="card__head"><div class="card__title">${icon('target')}Readiness requirements</div><span class="badge badge--outline">${project.requirements.filter((req) => req.status === 'Complete').length} of ${project.requirements.length} complete</span></div>
    <div class="card__body">
      ${groups.map((group) => {
        const reqs = project.requirements.filter((req) => req.group === group);
        return `<div class="req-group">
          <div class="req-group__head"><span>${esc(group)}</span><span>${reqs.filter((req) => req.status === 'Complete').length}/${reqs.length}</span></div>
          ${reqs.map((req) => {
            const iconName = req.status === 'Complete' ? 'checkCircle' : req.status === 'Partial' ? 'alertTriangle' : 'x';
            const iconClass = req.status === 'Complete' ? 'ok' : req.status === 'Partial' ? 'warn' : 'missing';
            return `<div class="req"><span class="req__icon req__icon--${iconClass}">${icon(iconName)}</span><div class="req__main"><div class="req__title">${esc(req.title)}</div><div class="req__meta">${esc(req.note)}</div></div><span class="req__badge">${statusBadge(req.status)}</span></div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="note-strip" style="margin-top:18px">${icon('info', 'icon--sm')}<span><strong>Deterministic by design.</strong> The readiness score is derived only from approved claims and recorded requirements. Re-evaluating in this preview simulates the engine and does not call the API.</span></div>`;
}

/* ============================================================
   Project · Successor workspace
   ============================================================ */
function renderTaskList(project, tasks, compact = false) {
  if (!tasks.length) return emptyState('checkCircle', 'No successor tasks', 'Derived tasks appear here when the handover identifies incomplete work or open questions.');
  return `<div class="task-list">
    ${tasks.map((task) => `<div class="task ${task.done ? 'is-done' : ''}">
      <button class="task__check" type="button" data-action="toggle-task" data-project="${project.id}" data-task="${task.id}" aria-label="${task.done ? 'Reopen' : 'Complete'} task: ${esc(task.title)}" aria-pressed="${task.done ? 'true' : 'false'}">${icon('check', 'icon--sm')}</button>
      <div class="task__body">
        <div class="task__title">${esc(task.title)}</div>
        ${compact ? '' : `<p class="task__desc">${esc(task.description)}</p>`}
        <div class="task__meta">${badge(task.priority, task.priority === 'High' ? 'red' : 'amber', 'flag')}${statusBadge(task.done ? 'Complete' : task.status)}<span>${esc(task.origin)}</span>${!compact && task.criteria ? `<span>·</span><span>${esc(task.criteria)}</span>` : ''}</div>
      </div>
    </div>`).join('')}
  </div>`;
}

  <div class="guide-layout">
    <div class="stack-4">

        <div>
          ${sections.map((section) => `<section class="guide-section">
            <div class="guide-section__head">${icon('checkCircle')}${esc(section.title)}</div>

    </div>

    <div class="aside-stack">
      <div class="card aside-card">

        <div class="def-list">
          ${defRow('Successor role', `<strong>${esc(project.successorRole)}</strong>`)}
          ${defRow('Departing role', esc(project.departingRole))}

          <a class="doc-item" href="#/projects/${project.id}/memory">${icon('brain', 'icon--sm')}<span style="flex:1">Project memory</span><span class="badge badge--outline badge--mono">${project.claimCount}</span></a>
          <a class="doc-item" href="#/projects/${project.id}/knowledge-risk">${icon('alertTriangle', 'icon--sm')}<span style="flex:1">Knowledge risk</span><span class="badge badge--amber badge--mono">${project.knowledgeGaps}</span></a>

/* ============================================================
   Project · Successor checklist
   ============================================================ */
function renderSuccessorChecklist(project) {
  const done = project.tasks.filter((task) => task.done).length;
  const total = project.tasks.length;
  const percent = total ? Math.round((done / total) * 100) : 0;
  return `${sectionHead('Successor checklist', 'Concrete next steps derived from unfinished work, open questions and recorded risks.', `<span class="badge badge--outline">${done} of ${total} complete</span><button class="btn btn--secondary btn--sm" type="button" data-action="add-task" data-project="${project.id}">${icon('plus')}Add task</button>`)}

  return `${sectionHead('Knowledge risk', 'Single-owner areas, missing procedures and stale evidence that make this handover fragile.', `<span class="badge badge--red">${count('Critical')} critical</span><span class="badge badge--amber">${count('High')} high</span>`)}

  <div class="grid grid--4">

/* ============================================================
   Router
   ============================================================ */
const PROJECT_TAB_LABELS = {
  overview: 'Overview',
  sources: 'Sources',
  upload: 'Upload sources',
  github: 'Connect GitHub',
  memory: 'Memory',
  claims: 'Claims',
  conflicts: 'Conflicts',
  uncertainty: 'Uncertainty',
  timeline: 'Timeline',
  review: 'Review queue',
  handover: 'Handover',
  readiness: 'Readiness',
  'successor-workspace': 'Successor workspace',
  'successor-checklist': 'Successor checklist',
  'knowledge-risk': 'Knowledge risk',
  evaluation: 'Evaluation',
  'system-health': 'System health',
  audit: 'Audit'
};

function resolveRoute() {
  const raw = (window.location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  if (!parts.length || parts[0] === 'dashboard') return { name: 'dashboard' };
  if (parts[0] === 'projects') {
    if (parts[1] === 'new') return { name: 'project-new' };
    if (!parts[1]) return { name: 'projects' };
    let pid = parts[1]; if (pid === "payment-gateway") pid = "payment-gateway-system"; if (pid === "subscription-billing") pid = "subscription-billing-dunning"; if (pid === "cold-chain") pid = "cold-chain-inventory-alerts"; const project = PROJECT_MAP[pid];
    if (!project) return { name: 'not-found' };
    const rest = parts.slice(2);
    let tab = 'overview';
    if (rest[0] === 'sources') tab = rest[1] === 'upload' ? 'upload' : rest[1] === 'github' ? 'github' : 'sources';
    else if (rest[0] === 'memory') {
      const sub = rest[1];
      tab = sub === 'review' ? 'review' : sub === 'claims' ? 'claims' : sub === 'conflicts' ? 'conflicts' : sub === 'uncertainty' ? 'uncertainty' : sub === 'timeline' ? 'timeline' : 'memory';
    } else if (rest[0] === 'review') tab = 'review';
    else if (rest[0] === 'timeline') tab = 'timeline';
    else if (rest[0] === 'handover') tab = 'handover';
    else if (rest[0] === 'readiness') tab = 'readiness';
    else if (rest[0] === 'successor-workspace') tab = 'successor-workspace';
    else if (rest[0] === 'successor-checklist') tab = 'successor-checklist';
    else if (rest[0] === 'knowledge-risk') tab = 'knowledge-risk';
    else if (rest[0] === 'evaluation') tab = 'evaluation';
    else if (rest[0] === 'system-health') tab = 'system-health';
    else if (rest[0] === 'audit') tab = 'audit';
    else if (rest[0]) return { name: 'not-found' };
    return { name: `project-${tab}`, projectId: project.id, tab, tabLabel: PROJECT_TAB_LABELS[tab] || 'Project' };
  }
  if (parts[0] === 'sources') {
    if (parts[1]) {
      const found = projectBySource(parts[1]);
      return { name: 'source-detail', sourceId: parts[1], sourceName: found ? found.source.name : 'Source details' };
    }
    return { name: 'sources' };
  }
  if (parts[0] === 'settings') return { name: 'settings' };
  return { name: 'not-found' };
}

function renderProjectRoute(project, route) {
  let inner = '';
  switch (route.tab) {
    case 'overview': inner = renderProjectOverview(project); break;
    case 'sources': inner = renderProjectSources(project); break;
    case 'upload': inner = renderUploadPage(project); break;
    case 'github': inner = renderGitHubPage(project); break;
    case 'memory': inner = renderProjectMemory(project); break;
    case 'claims': inner = renderClaims(project); break;
    case 'review': inner = renderReviewQueue(project); break;
    case 'conflicts': inner = renderConflicts(project); break;
    case 'uncertainty': inner = renderUncertainty(project); break;
    case 'timeline': inner = renderTimeline(project); break;
    case 'handover': inner = renderHandover(project); break;
    case 'readiness': inner = renderReadiness(project); break;
    case 'successor-workspace': inner = renderSuccessorWorkspace(project); break;
    case 'successor-checklist': inner = renderSuccessorChecklist(project); break;
    case 'knowledge-risk': inner = renderKnowledgeRisk(project); break;
    case 'evaluation': inner = renderEvaluation(project); break;
    case 'system-health': inner = renderSystemHealth(project); break;
    case 'audit': inner = renderAudit(project); break;
    default: return renderNotFound();
  }
  return renderProjectShell(project, route, inner);
}

function renderRoute(route) {
  switch (route.name) {
    case 'dashboard': return renderDashboard();
    case 'projects': return renderProjects();
    case 'project-new': return renderNewProject();
    case 'sources': return renderSources();
    case 'source-detail': return renderSourceDetail(route.sourceId);
    case 'settings': return renderSettings();
    case 'not-found': return renderNotFound();
    default:
      if (route.name.startsWith('project-')) {
        const project = PROJECT_MAP[route.projectId];
        return project ? renderProjectRoute(project, route) : renderNotFound();
      }
      return renderNotFound();
  }
}

function renderApp() {
  const route = resolveRoute();
  state.route = route;
  const content = renderRoute(route);
  const app = document.getElementById('app');
  app.innerHTML = `${renderSidebar(route)}
    <div class="main">
      ${renderTopbar(route)}
      <main class="main__scroll" id="main-content" tabindex="-1">
        <div class="content page-in" id="page-root">${content}</div>
      </main>
    </div>`;
  const project = route.projectId ? PROJECT_MAP[route.projectId] : null;
  const title = route.name === 'dashboard' ? 'Overview'
    : route.name === 'projects' ? 'Projects'
    : route.name === 'project-new' ? 'New project'
    : route.name === 'sources' ? 'Sources'
    : route.name === 'source-detail' ? (route.sourceName || 'Source details')
    : route.name === 'settings' ? 'Settings'
    : project ? `${project.name} · ${route.tabLabel || 'Project'}` : 'Not found';
  document.title = `${title} — Continuum`;
  document.body.classList.toggle('nav-open', state.mobileNav);
}

let toastSequence = 0;

function removeToast(toast) {
  if (!toast || toast.dataset.leaving === 'true') return;
  toast.dataset.leaving = 'true';
  toast.classList.add('is-leaving');
  window.setTimeout(() => toast.remove(), 180);
}

function addToast(title, description = '', tone = 'blue', iconName = '') {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const icons = { blue: 'info', green: 'checkCircle', amber: 'alertTriangle', red: 'alertCircle' };
  const toast = document.createElement('div');
  toast.className = `toast${tone && tone !== 'blue' ? ` toast--${tone}` : ''}`;
  toast.dataset.toast = String(++toastSequence);
  toast.setAttribute('role', 'status');
  toast.innerHTML = `<span class="toast__icon">${icon(iconName || icons[tone] || 'info')}</span>
    <div class="toast__main"><div class="toast__title">${esc(title)}</div>${description ? `<div class="toast__desc">${esc(description)}</div>` : ''}</div>
    <button class="toast__close" type="button" data-action="dismiss-toast" aria-label="Dismiss notification">${icon('x', 'icon--sm')}</button>`;
  root.appendChild(toast);
  window.setTimeout(() => removeToast(toast), 4800);
}

function openModal({ title, sub = '', body = '', foot = '', size = '', label = '' }) {
  const root = document.getElementById('modal-root');
  state.lastModalTrigger = document.activeElement;
  root.innerHTML = `<div class="modal-backdrop" data-backdrop="true">
    <div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modal-title" ${label ? `aria-label="${esc(label)}"` : ''} tabindex="-1">
      <div class="modal__head">
        <div><div class="modal__title" id="modal-title">${esc(title)}</div>${sub ? `<div class="modal__sub">${sub}</div>` : ''}</div>
        <button class="modal__close" type="button" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button>
      </div>
      <div class="modal__body">${body}</div>
      ${foot ? `<div class="modal__foot">${foot}</div>` : ''}
    </div>
  </div>`;
  document.body.classList.add('modal-open');
  const modal = root.querySelector('.modal');
  const focusTarget = root.querySelector('[data-autofocus]') || modal;
  if (focusTarget) focusTarget.focus();
}

function closeModal(restoreFocus = true) {
  const root = document.getElementById('modal-root');
  if (!root || !root.innerHTML) return;
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
  const trigger = state.lastModalTrigger;
  state.lastModalTrigger = null;
  if (restoreFocus && trigger && document.contains(trigger)) {
    try { trigger.focus(); } catch (error) { /* no-op */ }
  }
}

function downloadFile(filename, content, mime = 'text/plain;charset=utf-8') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1200);
}

  const rows = [['Time', 'Category', 'Event', 'Metadata']];
  project.audit.forEach((entry) => rows.push([entry.time, entry.category, entry.title, entry.meta]));
  const csv = rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  downloadFile(`${project.id}-audit-log.csv`, csv, 'text/csv;charset=utf-8');
  addToast('Audit log exported', `${project.audit.length} synthetic audit events were downloaded as CSV.`, 'green', 'download');
}

function renderWithSearchFocus(searchKey) {
  renderApp();
  const input = document.querySelector(`[data-search="${searchKey}"]`);
  if (input) {
    input.focus();
    const length = input.value.length;
    try { input.setSelectionRange(length, length); } catch (error) { /* no-op */ }
  }
}

/* ============================================================
   Event delegation
   ============================================================ */
function handleAction(actionEl) {
  const action = actionEl.dataset.action;
  const projectId = actionEl.dataset.project;
  const project = projectId ? PROJECT_MAP[projectId] : null;

  switch (action) {
    case 'toggle-menu': {
      const dropdown = actionEl.closest('[data-dropdown]');
      if (!dropdown) return;
      const wasOpen = dropdown.classList.contains('is-open');
      closeMenus();
      if (!wasOpen) {
        dropdown.classList.add('is-open');
        actionEl.setAttribute('aria-expanded', 'true');
      }
      return;
    }
    case 'open-nav':
      setNav(true);
      return;
    case 'close-nav':
      setNav(false);
      return;
    case 'navigate': {
      const href = actionEl.dataset.href;
      closeMenus();
      setNav(false);
      if (!href) return;
      if (window.location.hash === `#${href}`) {
        renderApp();
        window.scrollTo({ top: 0, behavior: 'auto' });
      } else {
        window.location.hash = `#${href}`;
      }
      return;
    }
    case 'select-workspace': {
      const name = actionEl.dataset.name || WORKSPACE.name;
      closeMenus();
      if (state.workspace !== name) {
        state.workspace = name;
        renderApp();
        addToast('Workspace switched', `Now viewing ${name}.`, 'blue', 'layers');
      }
      return;
    }
    case 'open-ask-ai':
      closeMenus();
      openAskAiModal();
      return;
    case 'chart-range':
      UI.chartRange = actionEl.dataset.range || '1Y';
      renderApp();
      return;
    case 'run-ai-preset': {
      const key = actionEl.dataset.query;
      const data = AI_PRESETS[key];
      const area = document.getElementById('ai-response-area');
      const textEl = document.getElementById('ai-response-text');
      const metaEl = document.getElementById('ai-response-meta');
      if (data && area && textEl && metaEl) {
        area.style.display = 'block';
        textEl.textContent = data.answer;
        metaEl.innerHTML = `<span><strong>Citations:</strong> Claim ${data.claim}</span><span><strong>Source:</strong> <code style="color:#C995BC">${data.source}</code></span>`;
      }
      return;
    }
    case 'reset-demo':
      closeMenus();
      openResetModal();
      return;
    case 'confirm-reset':
      closeModal(false);
      addToast('Demo workspace reset', 'Pristine seed data is being restored…', 'green', 'rotate');
      window.setTimeout(() => {
        window.location.hash = '#/dashboard';
        window.location.reload();
      }, 700);
      return;
    case 'sign-out':
      closeMenus();
      openSignOutModal();
      return;
    case 'confirm-signout':
      closeModal(false);
      setNav(false);
      if (window.location.hash === '#/dashboard') renderApp();
      else window.location.hash = '#/dashboard';
      addToast('Session refreshed', 'Demo workspace reloaded in public judge mode.', 'blue', 'shieldCheck');
      return;
    case 'open-workspace-modal':
      closeMenus();
      openWorkspaceModal();
      return;
    case 'create-workspace':
      handleCreateWorkspace();
      return;
    case 'open-source':
      openSourceModal(projectId, actionEl.dataset.source);
      return;
    case 'open-claim':
      openClaimModal(projectId, actionEl.dataset.claim);
      return;
    case 'open-repository':
      openRepositoryModal(projectId);
      return;
    case 'close-modal':
      closeModal();
      return;
    case 'dismiss-toast':
      removeToast(actionEl.closest('.toast'));
      return;
    case 'review-filter':
      UI.reviewFilter = actionEl.dataset.filter || 'pending';
      renderApp();
      return;
    case 'timeline-filter':
      UI.timelineFilter = actionEl.dataset.filter || 'all';
      renderApp();
      return;
    case 'audit-filter':
      UI.auditFilter = actionEl.dataset.filter || 'all';
      renderApp();
      return;
    case 'knowledge-filter':
      UI.knowledgeFilter = actionEl.dataset.filter || 'all';
      renderApp();
      return;
    case 'select-conflict':
      UI.selectedConflict = actionEl.dataset.conflict;
      renderApp();
      return;
    case 'resolve-conflict': {
      if (!project) return;
      const conflict = project.conflicts.find((item) => item.id === actionEl.dataset.conflict);
      const selected = document.querySelector('input[name="conflict-decision"]:checked');
      if (!conflict) return;
      if (!selected) {
        addToast('Choose a resolution', 'Select which claim stands, or record that both are valid in different contexts.', 'amber', 'info');
        return;
      }
      const value = selected.value;
      conflict.status = 'Resolved';
      conflict.resolved = 'just now';
      const labels = {
        '0': `Claim A stands: ${conflict.claims[0].text}`,
        '1': `Claim B stands: ${conflict.claims[1].text}`,
        'both': 'Both claims are valid in different contexts.'
      };
      conflict.resolution = labels[value] || 'Resolved by a human reviewer.';
      const firstProjectClaim = project.claims.find((claim) => claim.text === conflict.claims[0].text);
      const secondProjectClaim = project.claims.find((claim) => claim.text === conflict.claims[1].text);
      if (value === '0') {
        conflict.claims[0].status = 'Approved'; conflict.claims[1].status = 'Rejected';
        if (firstProjectClaim) firstProjectClaim.status = 'Approved';
        if (secondProjectClaim) secondProjectClaim.status = 'Rejected';
      } else if (value === '1') {
        conflict.claims[0].status = 'Rejected'; conflict.claims[1].status = 'Approved';
        if (firstProjectClaim) firstProjectClaim.status = 'Rejected';
        if (secondProjectClaim) secondProjectClaim.status = 'Approved';
      } else {
        conflict.claims[0].status = 'Approved'; conflict.claims[1].status = 'Approved';
        if (firstProjectClaim) firstProjectClaim.status = 'Approved';
        if (secondProjectClaim) secondProjectClaim.status = 'Approved';
      }
      UI.selectedConflict = conflict.id;
      renderApp();
      addToast('Conflict resolved', 'The decision was recorded. Both original claims remain in project memory for traceability.', 'green', 'checkCircle');
      return;
    }
    case 'approve-claim': {
      if (!project) return;
      const claim = project.claims.find((item) => item.id === actionEl.dataset.claim);
      if (!claim) return;
      claim.status = 'Approved';
      closeModal(false);
      renderApp();
      addToast('Claim approved', `Claim ${claim.id.toUpperCase()} is now approved with a human decision.`, 'green', 'shieldCheck');
      return;
    }
    case 'reject-claim': {
      if (!project) return;
      const claim = project.claims.find((item) => item.id === actionEl.dataset.claim);
      if (!claim) return;
      claim.status = 'Rejected';
      closeModal(false);
      renderApp();
      addToast('Claim rejected', `Claim ${claim.id.toUpperCase()} was rejected and kept in the audit trail.`, 'red', 'x');
      return;
    }
    case 'sources-page': {
      const page = Number(actionEl.dataset.page);
      if (Number.isFinite(page) && page > 0) {
        UI.sourcesPage = page;
        renderApp();
      }
      return;
    }
    case 'claims-page': {
      const page = Number(actionEl.dataset.page);
      if (Number.isFinite(page) && page > 0) {
        UI.claimsPage = page;
        renderApp();
      }
      return;
    }
    case 'clear-project-filters':
      UI.projectsSearch = ''; UI.projectsWorkspace = 'all'; UI.projectsStatus = 'all';
      renderApp();
      return;
    case 'clear-source-filters':
      UI.sourcesSearch = ''; UI.sourcesType = 'all'; UI.sourcesStatus = 'all'; UI.sourcesPage = 1;
      renderApp();
      return;
    case 'clear-claim-filters':
      UI.claimsSearch = ''; UI.claimsType = 'all'; UI.claimsStatus = 'all'; UI.claimsPage = 1;
      renderApp();
      return;
    case 'toggle-task': {
      if (!project) return;
      const task = project.tasks.find((item) => item.id === actionEl.dataset.task);
      if (!task) return;
      task.done = !task.done;
      task.status = task.done ? 'Complete' : 'Not started';
      renderApp();
      if (task.done) addToast('Task completed', task.title, 'green', 'checkCircle');
      return;
    }
    case 'add-task':
      openAddTaskModal(projectId);
      return;
    case 'save-task':
      handleSaveTask(projectId);
      return;
    case 'pick-files':
      document.getElementById('upload-input')?.click();
      return;
    case 'remove-upload': {
      const index = Number(actionEl.dataset.index);
      if (Number.isFinite(index)) {
        UI.uploadFiles.splice(index, 1);
        renderApp();
      }
      return;
    }
    case 'clear-uploads':
      UI.uploadFiles = [];
      renderApp();
      return;
    case 'process-uploads': {
      const count = UI.uploadFiles.length;
      UI.uploadFiles = [];
      renderApp();
      addToast('Files processed — preview', count ? `${count} ${count === 1 ? 'file' : 'files'} would be validated, scanned, normalised and hashed by the ingestion pipeline.` : 'No files were selected.', 'green', 'sparkles');
      return;
    }
    case 'delete-project':
      openDeleteModal(projectId);
      return;
    case 'confirm-delete':
      closeModal(false);
      addToast('Preview only — deletion disabled', 'Project deletion requires the Continuum API and admin role. No demonstration data was removed.', 'amber', 'info');
      return;
    case 'disconnect-github':
      openDisconnectModal();
      return;
    case 'confirm-disconnect':
      closeModal(false);
      state.githubConnected = false;
      renderApp();
      addToast('GitHub disconnected — preview', 'The synthetic connection was removed for this session. Imported sources remain available.', 'amber', 'plug');
      return;
    case 'connect-github':
      state.githubConnected = true;
      renderApp();
      addToast('GitHub connected — preview', 'A read-only connection was simulated. No external account was contacted.', 'green', 'github');
      return;
    case 'import-repository':
      addToast('Repository import simulated', 'GitHub OAuth and repository import require the backend. The selection flow is fully demonstrated here.', 'blue', 'github');
      return;
    case 'simulate-demo':
      addToast('Preview only', actionEl.dataset.message || 'This action depends on the Continuum backend and is simulated in the static preview.', 'amber', 'info');
      return;
    case 'run-extraction':
      addToast('Extraction queued — preview', `The full product would process ${project ? project.sources.length : 0} sources and surface new claims for human review.`, 'blue', 'sparkles');
      return;
    case 'run-evaluation':
      state.readinessUpdated = true;
      state.evaluationRun = true;
      renderApp();
      addToast('Readiness evaluation completed', `Deterministic score unchanged at ${project ? project.readiness : 98.2}%. Identical inputs reproduce the same result.`, 'green', 'target');
      return;
    case 'recheck-health':
      state.healthChecked = true;
      renderApp();
      addToast('Health checks complete', 'All six preview services responded normally. No backend was contacted.', 'green', 'activity');
      return;
    case 'download-handover':
      downloadHandover(projectId);
      return;
    case 'print-handover':
      closeMenus();
      addToast('Opening print dialog', 'Choose “Save as PDF” to export the handover document.', 'blue', 'fileText');
      window.setTimeout(() => window.print(), 200);
      return;
    case 'export-audit':
      exportAudit(projectId);
      return;
    case 'create-project':
      handleCreateProject();
      return;
    default:
      return;
  }
}

document.addEventListener('click', (event) => {
  if (event.target.matches('[data-backdrop]')) {
    closeModal();
    return;
  }

  const actionEl = event.target.closest('[data-action]');
  if (actionEl) handleAction(actionEl);

  const anchor = event.target.closest('a[href^="#/"]');
  if (anchor) {
    closeMenus();
    setNav(false);
  }

  if (!event.target.closest('[data-dropdown]')) closeMenus();
});

document.addEventListener('input', (event) => {
  const key = event.target.dataset.search;
  if (!key) return;
  if (key === 'projects') UI.projectsSearch = event.target.value;
  else if (key === 'sources') { UI.sourcesSearch = event.target.value; UI.sourcesPage = 1; }
  else if (key === 'claims') { UI.claimsSearch = event.target.value; UI.claimsPage = 1; }
  renderWithSearchFocus(key);
});

document.addEventListener('change', (event) => {
  const filter = event.target.dataset.filter;
  if (filter === 'projects-workspace') { UI.projectsWorkspace = event.target.value; renderApp(); return; }
  if (filter === 'projects-status') { UI.projectsStatus = event.target.value; renderApp(); return; }
  if (filter === 'sources-type') { UI.sourcesType = event.target.value; UI.sourcesPage = 1; renderApp(); return; }
  if (filter === 'sources-status') { UI.sourcesStatus = event.target.value; UI.sourcesPage = 1; renderApp(); return; }
  if (filter === 'claims-type') { UI.claimsType = event.target.value; UI.claimsPage = 1; renderApp(); return; }
  if (filter === 'claims-status') { UI.claimsStatus = event.target.value; UI.claimsPage = 1; renderApp(); return; }

  if (event.target.id === 'upload-input') {
    const files = Array.from(event.target.files || []);
    if (files.length) {
      UI.uploadFiles = UI.uploadFiles.concat(files.map((file) => ({
        name: file.name,
        size: file.size > 1048576 ? `${(file.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`
      })));
      renderApp();
    }
  }
});

document.addEventListener('submit', (event) => {
  if (event.target.id === 'new-project-form') {
    event.preventDefault();
    handleCreateProject();
  } else if (event.target.id === 'workspace-form') {
    event.preventDefault();
    handleCreateWorkspace();
  } else if (event.target.id === 'task-form') {
    event.preventDefault();
    const saveButton = event.target.closest('.modal')?.querySelector('[data-action="save-task"]');
    if (saveButton) handleSaveTask(saveButton.dataset.project);
  }
});

document.addEventListener('dragover', (event) => {
  const zone = event.target.closest('.upload-zone');
  if (!zone) return;
  event.preventDefault();
  zone.style.borderColor = 'rgba(112,185,173,.42)';
  zone.style.background = 'rgba(112,185,173,.055)';
});

document.addEventListener('dragleave', (event) => {
  const zone = event.target.closest('.upload-zone');
  if (!zone) return;
  zone.style.borderColor = '';
  zone.style.background = '';
});

document.addEventListener('drop', (event) => {
  const zone = event.target.closest('.upload-zone');
  if (!zone) return;
  event.preventDefault();
  zone.style.borderColor = '';
  zone.style.background = '';
  const files = Array.from(event.dataTransfer?.files || []);
  if (!files.length) return;
  UI.uploadFiles = UI.uploadFiles.concat(files.map((file) => ({
    name: file.name,
    size: file.size > 1048576 ? `${(file.size / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(file.size / 1024))} KB`
  })));
  renderApp();
  addToast('Files added', `${files.length} ${files.length === 1 ? 'file is' : 'files are'} staged locally. Nothing was uploaded.`, 'blue', 'upload');
});

document.addEventListener('keydown', (event) => {
  const modal = document.querySelector('.modal');
  if (event.key === 'Escape') {
    if (modal) {
      closeModal();
      return;
    }
    closeMenus();
    if (state.mobileNav) setNav(false);
    return;
  }
  if (event.key === 'Tab' && modal) {
    const focusable = Array.from(modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter((element) => !element.disabled && element.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});


document.addEventListener('keydown', (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    openAskAiModal();
  }
});

window.addEventListener('hashchange', () => {
  closeMenus();
  setNav(false);
  closeModal(false);
  renderApp();
  window.scrollTo({ top: 0, behavior: 'auto' });
});

/* ============================================================
   Initialise preview
   ============================================================ */
if (!window.location.hash) {
  history.replaceState(null, '', '#/dashboard');
}
renderApp();


</script>
</body>
</html>
